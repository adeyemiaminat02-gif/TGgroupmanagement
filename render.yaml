services:
  - type: worker
    name: tg-group-management-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: TGgroupmanagementbot
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/bot.db
      - key: OWNER_ID
        sync: false
      - key: LOG_GROUP_ID
        sync: false
      - key: MAX_WARNINGS
        value: "3"
      - key: VERIFY_TIMEOUT
        value: "120"
      - key: AUTO_DELETE_WELCOME
        value: "30"
      - key: LOG_LEVEL
        value: INFO
